<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Curadoria ELO</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Google Drive API -->
    <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>

    <style>
        /* =========================================
           RESET E LAYOUT BASE
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* 100dvh resolve o problema das barras de navegação do mobile escondendo o conteúdo */
        body { background-color: #000; color: #fff; overflow: hidden; height: 100dvh; width: 100vw; display: flex; flex-direction: column; }

        /* =========================================
           TELA DE LOGIN E LOADING
           ========================================= */
        #auth-overlay, #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #auth_button {
            padding: 15px 35px; background: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: #000; text-transform: uppercase;
        }
        #loading-text { font-size: 1.2rem; color: #aaa; margin-top: 15px; text-align: center; padding: 0 20px;}

        /* =========================================
           CABEÇALHO E MENU SANDUÍCHE
           ========================================= */
        #header {
            height: 8vh; min-height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #111; border-bottom: 1px solid #333; z-index: 100;
        }
        #app-title { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; color: #fff; }
        #menu-btn { font-size: 1.8rem; background: none; border: none; color: #fff; cursor: pointer; }

        /* Menu Lateral (Drawer) */
        #side-menu {
            position: fixed; top: 0; right: -100%; width: 85vw; max-width: 400px; height: 100dvh; background: #1a1a1a; z-index: 1000; transition: right 0.3s ease; box-shadow: -5px 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column;
        }
        #side-menu.open { right: 0; }
        .menu-header { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #333; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .menu-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        
        .menu-section-title { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-bottom: 15px; margin-top: 20px; }
        .folder-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; cursor: pointer; }
        .folder-item span.count { color: #aaa; font-size: 0.85rem; }
        .btn-global-rank { background: #e91e63; color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; width: 100%; border: none; margin-top: 10px;}

        /* =========================================
           ÁREA DE DUELO (MATCHUP)
           ========================================= */
        #arena {
            flex: 1; display: flex; flex-direction: column; width: 100vw; overflow: hidden;
        }
        .combatant {
            flex: 1; position: relative; width: 100%; border-bottom: 2px solid #000; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #050505; overflow: hidden;
        }
        .combatant img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease;
        }
        .combatant:active img { transform: scale(0.98); }

        /* Overlay de Informações na Foto respeitando botões nativos do OS */
        .img-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; 
            padding: 40px 15px max(15px, env(safe-area-inset-bottom)) 15px; 
            background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
        }
        .img-elo { font-weight: bold; font-size: 1.2rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,1); display: flex; align-items: center; }
        .img-loyalty { font-size: 0.85rem; color: #ffeb3b; margin-left: 10px; text-shadow: 0 1px 2px rgba(0,0,0,1); }
        
        /* Botão de Coração (Favoritas) */
        .btn-heart {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 45px; height: 45px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; backdrop-filter: blur(5px); color: #fff; transition: all 0.2s; margin-bottom: 5px;
        }
        .btn-heart.active { color: #e91e63; border-color: #e91e63; background: rgba(233, 30, 99, 0.2); }

        /* Animações de Vitória/Derrota */
        .combatant.winner { z-index: 10; animation: winPulse 0.5s forwards; }
        .combatant.loser { filter: grayscale(100%) opacity(0.5); }
        @keyframes winPulse { 0% { transform: scale(1); box-shadow: inset 0 0 0px 0px #4caf50; } 50% { transform: scale(1.02); box-shadow: inset 0 0 0px 10px #4caf50; } 100% { transform: scale(1); box-shadow: inset 0 0 0px 0px #4caf50; } }

        /* =========================================
           TELAS DE RANKING
           ========================================= */
        #ranking-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 2000; display: none; flex-direction: column;
        }
        .rank-header { padding: 20px; display: flex; align-items: center; background: #111; border-bottom: 1px solid #333; padding-top: max(20px, env(safe-area-inset-top)); }
        .rank-header button { background: none; border: none; color: #fff; font-size: 1.5rem; margin-right: 15px; cursor: pointer; }
        .rank-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .rank-item { position: relative; aspect-ratio: 1; background: #222; }
        .rank-item img { width: 100%; height: 100%; object-fit: cover; }
        .rank-badge { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <!-- OVERLAYS -->
    <div id="auth-overlay">
        <h2 style="margin-bottom: 20px;">Curadoria ELO</h2>
        <button id="auth_button" onclick="handleAuthClick()" style="display:none;">Conectar Google</button>
    </div>
    <div id="loading-overlay" style="display:none;">
        <div class="loader">⏳</div>
        <div id="loading-text">Sincronizando banco de dados...</div>
    </div>

    <!-- CABEÇALHO -->
    <div id="header">
        <div id="app-title">ELO MATCHUP</div>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <!-- MENU SANDUÍCHE -->
    <div id="side-menu">
        <div class="menu-header">
            <h3>Navegação</h3>
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="menu-content">
            <button class="btn-global-rank" onclick="openLoyaltyRank()" style="background:#ff9800; color:#000;">🏆 100% LEALDADE</button>
            <button class="btn-global-rank" onclick="openHeartRank()">❤️ FAVORITAS MANUAIS</button>
            <div class="menu-section-title">Bolhas de Curadoria (>30 img)</div>
            <div id="folder-list-container">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <!-- TELA DE RANKING -->
    <div id="ranking-screen">
        <div class="rank-header">
            <button onclick="closeRank()">←</button>
            <h3 id="rank-title">Ranking</h3>
        </div>
        <div class="rank-grid" id="rank-grid-container">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <!-- ARENA DE DUELO -->
    <div id="arena">
        <div class="combatant" id="fighter1" onclick="vote(1)">
            <img id="img1" src="" alt="Fighter 1">
            <div class="img-overlay">
                <div class="img-elo" id="elo-container1">
                    <span id="elo1">0</span>
                    <span class="img-loyalty" id="loyalty1">0%</span>
                </div>
                <button class="btn-heart" id="heart1" onclick="toggleHeart(event, 1)">🤍</button>
            </div>
        </div>
        
        <div class="combatant" id="fighter2" onclick="vote(2)">
            <img id="img2" src="" alt="Fighter 2">
            <div class="img-overlay">
                <div class="img-elo" id="elo-container2">
                    <span id="elo2">0</span>
                    <span class="img-loyalty" id="loyalty2">0%</span>
                </div>
                <button class="btn-heart" id="heart2" onclick="toggleHeart(event, 2)">🤍</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // ==========================================
        // CONFIGURAÇÕES FIREBASE & DRIVE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBrbd4jmxzoggc4WKAmddSOG1Tb63h2oIU",
            authDomain: "refs-3d4f4.firebaseapp.com",
            projectId: "refs-3d4f4",
            storageBucket: "refs-3d4f4.firebasestorage.app",
            messagingSenderId: "1008085824673",
            appId: "1:1008085824673:web:7a6f3e4541deef62b62ce0",
            measurementId: "G-LCQV4RZDC4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const CLIENT_ID = '905891014579-fjgqvkgbiucl4c0asn68pbv1p5gm6ofn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive';
        const ROOT_FOLDER_ID = '1Q_VHyF-8aXg_9zwzCABTeXvY1X6ksjF0'; 
        const REJECT_FOLDER_ID = '1UL8zEJGWWH2A1NEt-pUhRDQ9sTj9KI6w'; 

        let tokenClient, gapiInited = false, gsisInited = false;
        
        // Estado
        let activeFolders = [];
        let folderData = {}; 
        let currentMatchup = { folderId: null, img1: null, img2: null };
        let isProcessingVote = false;

        // Cálculos Auxiliares
        const getLoyalty = (img) => img.matches > 0 ? Math.round((img.wins / img.matches) * 100) : 0;

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        function gapiLoaded() {
            gapi.load('client', () => {
                gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] })
                .then(() => { gapiInited = true; checkAuthReady(); });
            });
        }
        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
            gsisInited = true; checkAuthReady();
        }
        function checkAuthReady() {
            if (gapiInited && gsisInited) document.getElementById('auth_button').style.display = 'block';
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) return;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';
                await initializeAppSystem();
            };
            tokenClient.requestAccessToken();
        }

        function updateLoadingText(text) { document.getElementById('loading-text').innerText = text; }

        async function initializeAppSystem() {
            updateLoadingText("Lendo bolhas de categoria...");
            const folders = await getSubfolders(ROOT_FOLDER_ID);
            
            for (let i = 0; i < folders.length; i++) {
                updateLoadingText(`Avaliando pasta: ${folders[i].name}...`);
                const images = await getImagesFromFolder(folders[i].id);
                
                if (images.length >= 30) {
                    await syncFolderWithFirebase(folders[i].id, images);
                    activeFolders.push({ id: folders[i].id, name: folders[i].name, count: images.length });
                }
            }

            if (activeFolders.length === 0) {
                updateLoadingText("Nenhuma pasta possui 30 ou mais arquivos válidos.");
                return;
            }

            renderMenu();
            document.getElementById('loading-overlay').style.display = 'none';
            setupNextMatch();
        }

        async function getSubfolders(parentId) {
            let folders = []; let pageToken = null;
            do {
                const res = await gapi.client.drive.files.list({
                    q: `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
                    fields: 'nextPageToken, files(id, name)', pageToken: pageToken
                });
                folders = folders.concat(res.result.files);
                pageToken = res.result.nextPageToken;
            } while (pageToken);
            return folders;
        }

        async function getImagesFromFolder(folderId) {
            let images = []; let pageToken = null;
            do {
                const res = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and mimeType contains 'image/' and trashed = false`,
                    fields: 'nextPageToken, files(id, thumbnailLink)', pageSize: 100, pageToken: pageToken
                });
                images = images.concat(res.result.files.map(f => ({ id: f.id, url: f.thumbnailLink.replace('=s220', '=s800') })));
                pageToken = res.result.nextPageToken;
            } while (pageToken);
            return images;
        }

        async function syncFolderWithFirebase(folderId, driveImages) {
            const batch = db.batch();
            const collectionRef = db.collection('images');
            let imgData = [];

            const snapshot = await collectionRef.where('folderId', '==', folderId).get();
            const firebaseMap = new Map();
            snapshot.forEach(doc => firebaseMap.set(doc.id, doc.data()));

            driveImages.forEach(img => {
                if (!firebaseMap.has(img.id)) {
                    // Inicialização incluindo Contadores de Lealdade
                    const newDoc = { folderId: folderId, elo: 0, hearts: 0, wins: 0, matches: 0, url: img.url, faced: [] };
                    batch.set(collectionRef.doc(img.id), newDoc);
                    imgData.push({ id: img.id, ...newDoc });
                } else {
                    const existing = firebaseMap.get(img.id);
                    existing.url = img.url; 
                    // Fallback para documentos antigos
                    existing.wins = existing.wins || 0;
                    existing.matches = existing.matches || 0;
                    imgData.push({ id: img.id, ...existing });
                }
            });
            await batch.commit();
            folderData[folderId] = imgData; 
        }

        // ==========================================
        // SISTEMA DE MATCHUP (ROUND-ROBIN)
        // ==========================================
        function setupNextMatch() {
            isProcessingVote = false;
            document.getElementById('fighter1').className = 'combatant';
            document.getElementById('fighter2').className = 'combatant';

            const randomFolder = activeFolders[Math.floor(Math.random() * activeFolders.length)];
            const images = folderData[randomFolder.id];
            
            let p1, p2;
            let attempts = 0;
            const maxAttempts = 200;

            while (attempts < maxAttempts) {
                p1 = images[Math.floor(Math.random() * images.length)];
                p2 = images[Math.floor(Math.random() * images.length)];
                
                if (p1.id !== p2.id) {
                    const p1Faced = p1.faced || [];
                    if (!p1Faced.includes(p2.id)) break; 
                }
                attempts++;
            }

            if (attempts >= maxAttempts) {
                handleCycleEnd(randomFolder.id);
                return; 
            }

            currentMatchup = { folderId: randomFolder.id, img1: p1, img2: p2 };
            updateArenaUI();
        }

        function updateArenaUI() {
            const { img1, img2 } = currentMatchup;
            
            document.getElementById('img1').src = img1.url;
            document.getElementById('elo1').innerText = `ELO: ${Math.round(img1.elo)}`;
            document.getElementById('loyalty1').innerText = `🏆 L: ${getLoyalty(img1)}%`;
            const h1 = document.getElementById('heart1');
            h1.className = img1.hearts > 0 ? 'btn-heart active' : 'btn-heart';
            h1.innerText = img1.hearts > 0 ? '❤️' : '🤍';

            document.getElementById('img2').src = img2.url;
            document.getElementById('elo2').innerText = `ELO: ${Math.round(img2.elo)}`;
            document.getElementById('loyalty2').innerText = `🏆 L: ${getLoyalty(img2)}%`;
            const h2 = document.getElementById('heart2');
            h2.className = img2.hearts > 0 ? 'btn-heart active' : 'btn-heart';
            h2.innerText = img2.hearts > 0 ? '❤️' : '🤍';
        }

        // ==========================================
        // CÁLCULO DE ELO E VOTAÇÃO
        // ==========================================
        async function vote(winnerNumber) {
            if (isProcessingVote) return;
            isProcessingVote = true;

            const { img1, img2 } = currentMatchup;
            const winner = winnerNumber === 1 ? img1 : img2;
            const loser = winnerNumber === 1 ? img2 : img1;

            document.getElementById(`fighter${winnerNumber}`).classList.add('winner');
            document.getElementById(`fighter${winnerNumber === 1 ? 2 : 1}`).classList.add('loser');

            // Cálculo ELO
            const K = 32;
            const expectedWinner = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
            const expectedLoser = 1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400));

            const newWinnerElo = winner.elo + K * (1 - expectedWinner);
            const newLoserElo = loser.elo + K * (0 - expectedLoser);

            // Atualiza RAM (Lealdade e ELO)
            winner.elo = newWinnerElo;
            winner.faced.push(loser.id);
            winner.wins += 1;
            winner.matches += 1;

            loser.elo = newLoserElo;
            loser.faced.push(winner.id);
            loser.matches += 1;

            // Envia para Firebase
            db.collection('images').doc(winner.id).update({ elo: newWinnerElo, faced: winner.faced, wins: winner.wins, matches: winner.matches });
            db.collection('images').doc(loser.id).update({ elo: newLoserElo, faced: loser.faced, matches: loser.matches });

            setTimeout(setupNextMatch, 600); 
        }

        async function toggleHeart(e, fNumber) {
            e.stopPropagation(); 
            const img = fNumber === 1 ? currentMatchup.img1 : currentMatchup.img2;
            const btn = document.getElementById(`heart${fNumber}`);
            
            if (img.hearts === 0) {
                img.hearts = 1;
                btn.className = 'btn-heart active';
                btn.innerText = '❤️';
            } else {
                img.hearts = 0;
                btn.className = 'btn-heart';
                btn.innerText = '🤍';
            }
            db.collection('images').doc(img.id).update({ hearts: img.hearts });
        }

        // ==========================================
        // FIM DE CICLO: EXPURGO POR LEALDADE (< 15%)
        // ==========================================
        async function handleCycleEnd(folderId) {
            document.getElementById('loading-overlay').style.display = 'flex';
            updateLoadingText("Ciclo completo! Expurgando imagens infiéis (<15%)...");

            let images = folderData[folderId];
            let survivingImages = [];
            let movePromises = [];

            for (let img of images) {
                let loyaltyScore = getLoyalty(img);
                
                // Exclusão por Baixa Lealdade
                if (img.matches > 0 && loyaltyScore < 15) {
                    movePromises.push(
                        gapi.client.drive.files.update({
                            fileId: img.id, addParents: REJECT_FOLDER_ID, removeParents: folderId, fields: 'id'
                        })
                    );
                    db.collection('images').doc(img.id).delete();
                } else {
                    img.faced = [];
                    db.collection('images').doc(img.id).update({ faced: [] });
                    survivingImages.push(img);
                }
            }

            await Promise.all(movePromises);
            folderData[folderId] = survivingImages;
            
            if (survivingImages.length < 30) {
                activeFolders = activeFolders.filter(f => f.id !== folderId);
                alert(`Uma pasta atingiu menos de 30 imagens e foi aposentada das disputas.`);
                renderMenu();
            }

            document.getElementById('loading-overlay').style.display = 'none';
            setupNextMatch();
        }

        // ==========================================
        // MENUS E RANKS
        // ==========================================
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

        function renderMenu() {
            const container = document.getElementById('folder-list-container');
            container.innerHTML = '';
            activeFolders.forEach(f => {
                const div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = `<span>${f.name}</span> <span class="count">${folderData[f.id].length} img</span>`;
                div.onclick = () => openFolderRank(f.id, f.name);
                container.appendChild(div);
            });
        }

        function openLoyaltyRank() {
            toggleMenu();
            document.getElementById('rank-title').innerText = "100% Lealdade (Invictas)";
            const container = document.getElementById('rank-grid-container');
            container.innerHTML = '';

            let allImages = [];
            for (let key in folderData) { allImages = allImages.concat(folderData[key]); }
            
            // Filtra: Participou de lutas E venceu todas
            let loyalImages = allImages.filter(i => i.matches > 0 && getLoyalty(i) === 100);
            loyalImages.sort((a, b) => b.elo - a.elo); // Desempate por ELO

            loyalImages.forEach(img => {
                container.innerHTML += `<div class="rank-item"><img src="${img.url}"><div class="rank-badge">🏆 ${Math.round(img.elo)}</div></div>`;
            });
            document.getElementById('ranking-screen').style.display = 'flex';
        }

        function openHeartRank() {
            toggleMenu();
            document.getElementById('rank-title').innerText = "Favoritas (Manuais)";
            const container = document.getElementById('rank-grid-container');
            container.innerHTML = '';

            let heartImages = [];
            for (let key in folderData) { heartImages = heartImages.concat(folderData[key].filter(i => i.hearts > 0)); }
            heartImages.sort((a, b) => b.elo - a.elo);

            heartImages.forEach(img => {
                container.innerHTML += `<div class="rank-item"><img src="${img.url}"><div class="rank-badge">❤️ ${Math.round(img.elo)}</div></div>`;
            });
            document.getElementById('ranking-screen').style.display = 'flex';
        }

        function openFolderRank(folderId, folderName) {
            toggleMenu();
            document.getElementById('rank-title').innerText = `Top: ${folderName}`;
            const container = document.getElementById('rank-grid-container');
            container.innerHTML = '';

            let sorted = [...folderData[folderId]].sort((a, b) => b.elo - a.elo);
            sorted.forEach((img, i) => {
                container.innerHTML += `<div class="rank-item"><img src="${img.url}"><div class="rank-badge">#${i+1} | E: ${Math.round(img.elo)}</div></div>`;
            });
            document.getElementById('ranking-screen').style.display = 'flex';
        }

        function closeRank() { document.getElementById('ranking-screen').style.display = 'none'; }
    </script>
</body>
</html>
