<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Curadoria ELO</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">

    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Google Drive API -->
    <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>

    <style>
        /* =========================================
           RESET E LAYOUT BASE
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: #000; color: #fff; overflow: hidden; height: 100dvh; width: 100vw; display: flex; flex-direction: column; }

        /* =========================================
           TELA DE LOGIN E LOADING
           ========================================= */
        #auth-overlay, #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #auth_button {
            padding: 15px 35px; background: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: #000; text-transform: uppercase;
        }
        #loading-text { font-size: 1.2rem; color: #aaa; margin-top: 15px; text-align: center; padding: 0 20px;}

        /* =========================================
           TOAST NOTIFICATIONS E AVISOS FLUTUANTES
           ========================================= */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px;
        }
        .toast {
            background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; font-weight: bold; text-align: center; font-size: 0.9rem;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.gold { background: #ffc107; color: #000; border: 1px solid #fff; }
        .toast.danger { background: #f44336; color: #fff; border: 1px solid #fff; }

        #focus-mode-banner {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: #e91e63; color: white; padding: 8px 20px; border-radius: 20px;
            font-size: 0.8rem; font-weight: bold; cursor: pointer; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 1px;
            display: none; border: 1px solid #fff; text-align: center;
        }
        #focus-mode-banner:active { transform: translateX(-50%) scale(0.95); }

        /* =========================================
           CABEÇALHO E MENU SANDUÍCHE
           ========================================= */
        #header {
            position: relative; height: 8vh; min-height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #111; border-bottom: 1px solid #333; z-index: 100;
        }
        #app-title { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; color: #fff; z-index: 2; }
        #header-folder-name { position: absolute; left: 50%; transform: translateX(-50%); font-size: 0.85rem; color: #ffeb3b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; text-align: center; z-index: 1; }
        #menu-btn { font-size: 1.8rem; background: none; border: none; color: #fff; cursor: pointer; z-index: 2; }

        /* Menu Lateral (Drawer) */
        #side-menu {
            position: fixed; top: 0; right: -100%; width: 85vw; max-width: 400px; height: 100dvh; background: #1a1a1a; z-index: 1000; transition: right 0.3s ease; box-shadow: -5px 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column;
        }
        #side-menu.open { right: 0; }
        .menu-header { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #333; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .menu-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        
        .menu-section-title { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-bottom: 15px; margin-top: 20px; }
        .folder-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; cursor: pointer; border-left: 4px solid #4caf50; }
        .folder-item span.count { color: #aaa; font-size: 0.85rem; }
        
        .btn-global-rank { background: #333; color: white; padding: 15px; border-radius: 8px; text-align: left; cursor: pointer; font-weight: bold; width: 100%; border: none; margin-bottom: 10px;}
        .btn-global-rank.gold { background: #ffc107; color: #000; }
        .btn-global-rank.danger { background: #f44336; color: #fff; }

        /* =========================================
           ÁREA DE DUELO (MATCHUP)
           ========================================= */
        #arena {
            flex: 1; display: flex; flex-direction: column; width: 100vw; overflow: hidden; position: relative;
        }
        
        #undo_button {
            position: absolute; top: 15px; left: 15px; z-index: 900; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); padding: 10px 18px; border-radius: 20px; color: #fff; font-weight: bold; backdrop-filter: blur(5px); cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #undo_button:active { background: rgba(255,255,255,0.3); }

        .combatant {
            flex: 1; position: relative; width: 100%; border-bottom: 2px solid #000; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #050505; overflow: hidden;
        }
        .combatant img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease;
        }
        .combatant:active img { transform: scale(0.98); }

        .img-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; 
            padding: 40px 15px max(15px, env(safe-area-inset-bottom)) 15px; 
            background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
        }
        
        .stats-container { display: flex; flex-direction: column; gap: 4px; text-shadow: 0 2px 4px rgba(0,0,0,1); }
        .stat-loyalty { font-weight: bold; font-size: 1.1rem; color: #ffeb3b; }
        
        .stat-fraction { font-size: 0.95rem; color: #fff; font-weight: bold; display: none; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px;} 

        .btn-block {
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; width: 50px; height: 50px; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; backdrop-filter: blur(5px); color: #fff; transition: all 0.2s; margin-bottom: 5px; flex-shrink: 0;
        }
        .btn-block:active { background: rgba(244, 67, 54, 0.4); border-color: #f44336; transform: scale(0.9); }

        .combatant.winner { z-index: 10; animation: winPulse 0.5s forwards; }
        .combatant.loser { filter: grayscale(100%) opacity(0.5); }
        .combatant.blocked { filter: sepia(100%) hue-rotate(300deg) blur(2px); opacity: 0.3; }
        @keyframes winPulse { 0% { transform: scale(1); box-shadow: inset 0 0 0px 0px #4caf50; } 50% { transform: scale(1.02); box-shadow: inset 0 0 0px 10px #4caf50; } 100% { transform: scale(1); box-shadow: inset 0 0 0px 0px #4caf50; } }

        /* =========================================
           TELAS DE RANKING (GRID DE 5 COLUNAS)
           ========================================= */
        #ranking-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 2000; display: none; flex-direction: column;
        }
        .rank-header { padding: 15px; display: flex; align-items: center; background: #111; border-bottom: 1px solid #333; padding-top: max(15px, env(safe-area-inset-top)); }
        .rank-header button { background: none; border: none; color: #fff; font-size: 1.5rem; margin-right: 15px; cursor: pointer; }
        .rank-title-container h3 { margin: 0; font-size: 1.1rem; }
        .rank-subtitle { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
        
        .rank-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 2px; padding-bottom: max(20px, env(safe-area-inset-bottom)); align-content: flex-start; }
        .rank-item { position: relative; aspect-ratio: 1; background: #222; width: 100%; }
        
        .rank-item img { width: 100%; height: 100%; object-fit: cover; transition: all 0.3s; }
        .rank-item img.exhausted { opacity: 0.3; filter: grayscale(80%); }

        .rank-badge { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.85); padding: 2px 4px; border-radius: 3px; font-size: 0.6rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    </style>
</head>
<body>

    <!-- OVERLAYS E TOAST -->
    <div id="toast-container"></div>

    <div id="auth-overlay">
        <h2 style="margin-bottom: 20px;">Curadoria ELO</h2>
        <button id="auth_button" onclick="handleAuthClick()" style="display:none;">Conectar Google</button>
    </div>
    <div id="loading-overlay" style="display:none;">
        <div class="loader">⏳</div>
        <div id="loading-text">Sincronizando banco de dados...</div>
    </div>

    <!-- CABEÇALHO -->
    <div id="header">
        <div id="app-title">ELO MATCHUP</div>
        <div id="header-folder-name"></div>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <!-- MENU SANDUÍCHE -->
    <div id="side-menu">
        <div class="menu-header">
            <h3>Painel de Controle</h3>
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="menu-content">
            <button class="btn-global-rank gold" onclick="openHorsConcoursRank()">🌟 HORS CONCOURS</button>
            <button class="btn-global-rank danger" onclick="openRejectedReport()">🗑️ RELATÓRIO DE EXCLUÍDAS</button>
            <button class="btn-global-rank" onclick="openLoyaltyRank()">🏆 GERAL (100% Invictas)</button>
            
            <div class="menu-section-title">Bolhas em Disputa Ativa</div>
            <div id="folder-list-container"></div>
        </div>
    </div>

    <!-- TELA DE RANKING -->
    <div id="ranking-screen">
        <div class="rank-header">
            <button onclick="closeRank()">←</button>
            <div class="rank-title-container" id="rank-title-area"></div>
        </div>
        <div class="rank-grid" id="rank-grid-container"></div>
    </div>

    <!-- ARENA DE DUELO -->
    <div id="arena">
        <button id="undo_button" onclick="undoLastVote()">↩ Desfazer Voto</button>
        <div id="focus-mode-banner" onclick="cancelFocusMode()">MODO FOCO ATIVO<br><span style="font-size: 0.65rem; font-weight: normal;">Clique para sair</span></div>

        <div class="combatant" id="fighter1" onclick="vote(1)">
            <img id="img1" src="" alt="Fighter 1">
            <div class="img-overlay">
                <div class="stats-container">
                    <div class="stat-loyalty" id="loyalty1"></div>
                    <div class="stat-fraction" id="fraction1"></div>
                </div>
                <button class="btn-block" onclick="blockImage(event, 1)" title="Bloquear e Excluir">🗑️</button>
            </div>
        </div>
        
        <div class="combatant" id="fighter2" onclick="vote(2)">
            <img id="img2" src="" alt="Fighter 2">
            <div class="img-overlay">
                <div class="stats-container">
                    <div class="stat-loyalty" id="loyalty2"></div>
                    <div class="stat-fraction" id="fraction2"></div>
                </div>
                <button class="btn-block" onclick="blockImage(event, 2)" title="Bloquear e Excluir">🗑️</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // ==========================================
        // Refresh a cada 20 minutos (1.200.000 ms)
        // ==========================================
        setTimeout(() => { window.location.reload(); }, 20 * 60 * 1000);

        // ==========================================
        // CONFIGURAÇÕES FIREBASE & DRIVE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBrbd4jmxzoggc4WKAmddSOG1Tb63h2oIU",
            authDomain: "refs-3d4f4.firebaseapp.com",
            projectId: "refs-3d4f4",
            storageBucket: "refs-3d4f4.firebasestorage.app",
            messagingSenderId: "1008085824673",
            appId: "1:1008085824673:web:7a6f3e4541deef62b62ce0",
            measurementId: "G-LCQV4RZDC4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const CLIENT_ID = '905891014579-fjgqvkgbiucl4c0asn68pbv1p5gm6ofn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive';
        const ROOT_FOLDER_ID = '1Q_VHyF-8aXg_9zwzCABTeXvY1X6ksjF0'; 
        const REJECT_FOLDER_ID = '1UL8zEJGWWH2A1NEt-pUhRDQ9sTj9KI6w'; 

        let tokenClient, gapiInited = false, gsisInited = false;
        
        // Estado Global
        let activeFolders = [];
        let folderData = {}; 
        let currentMatchup = { folderId: null, img1: null, img2: null };
        let isProcessingVote = false;
        let lastVoteState = null; 
        let targetedImgInfo = null;

        // Regras Matemáticas e Ordenação
        const getLoyalty = (img) => img.matches > 0 ? Math.round((img.wins / img.matches) * 100) : 0;
        const isHorsConcours = (img) => img.status === 'hors_concours';
        const isRejected = (img) => img.status === 'rejected';

        // Ordenação Dupla (ELO > Nome A-Z)
        const sortEloName = (a, b) => {
            if (b.elo !== a.elo) return b.elo - a.elo;
            const nameA = a.name || "";
            const nameB = b.name || "";
            return nameA.localeCompare(nameB);
        };

        function formatFolderName(name) {
            let formatted = name.replace(/^\d+\s*/, ''); 
            return formatted.split('-')[0].trim(); 
        }

        // ==========================================
        // LÓGICA DE CHECKPOINTS (Janela Dinâmica)
        // ==========================================
        function getNextCheckpoint(matches) {
            if (matches < 10) return 10;
            if (matches < 20) return 20;
            if (matches < 30) return 30;
            if (matches < 40) return 40;
            if (matches < 50) return 50;
            return Math.ceil((matches + 1) / 10) * 10;
        }

        // Retorna 'hc' (Hors Concours), 'reject' (Lixeira) ou null (Segue o jogo)
        function checkCheckpoints(img) {
            let m = img.matches;
            let l = getLoyalty(img);
            if (m >= 50) { if (l < 35) return 'reject'; if (l >= 75) return 'hc'; }
            else if (m >= 40) { if (l < 30) return 'reject'; if (l >= 80) return 'hc'; }
            else if (m >= 30) { if (l < 25) return 'reject'; if (l >= 85) return 'hc'; }
            else if (m >= 20) { if (l < 20) return 'reject'; if (l >= 90) return 'hc'; }
            else if (m >= 10) { if (l < 15) return 'reject'; }
            return null;
        }

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        function gapiLoaded() {
            gapi.load('client', () => {
                gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] })
                .then(() => { gapiInited = true; checkAuthReady(); });
            });
        }
        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
            gsisInited = true; checkAuthReady();
        }
        function checkAuthReady() {
            if (gapiInited && gsisInited) document.getElementById('auth_button').style.display = 'block';
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) return;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';
                await initializeAppSystem();
            };
            tokenClient.requestAccessToken();
        }

        function updateLoadingText(text) { document.getElementById('loading-text').innerText = text; }

        async function initializeAppSystem() {
            updateLoadingText("Lendo bolhas de categoria...");
            const folders = await getSubfolders(ROOT_FOLDER_ID);
            
            for (let i = 0; i < folders.length; i++) {
                updateLoadingText(`Sincronizando: ${folders[i].name}...`);
                const images = await getImagesFromFolder(folders[i].id);
                
                if (images.length > 0) {
                    await syncFolderWithFirebase(folders[i].id, images);
                    applyDynamicRules(folders[i].id);
                    activeFolders.push({ id: folders[i].id, name: folders[i].name });
                }
            }

            if (activeFolders.length === 0) {
                updateLoadingText("Nenhuma imagem válida encontrada.");
                return;
            }

            renderMenu();
            document.getElementById('loading-overlay').style.display = 'none';
            setupNextMatch();
        }

        async function getSubfolders(parentId) {
            let folders = []; let pageToken = null;
            do {
                const res = await gapi.client.drive.files.list({
                    q: `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
                    fields: 'nextPageToken, files(id, name)', pageToken: pageToken
                });
                folders = folders.concat(res.result.files);
                pageToken = res.result.nextPageToken;
            } while (pageToken);
            return folders;
        }

        async function getImagesFromFolder(folderId) {
            let images = []; let pageToken = null;
            do {
                const res = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and mimeType contains 'image/' and trashed = false`,
                    fields: 'nextPageToken, files(id, name, thumbnailLink)', pageSize: 100, pageToken: pageToken
                });
                images = images.concat(res.result.files.map(f => ({ id: f.id, name: f.name, url: f.thumbnailLink.replace('=s220', '=s800') })));
                pageToken = res.result.nextPageToken;
            } while (pageToken);
            return images;
        }

        async function syncFolderWithFirebase(folderId, driveImages) {
            const batch = db.batch();
            const collectionRef = db.collection('images');
            let imgData = [];

            const snapshot = await collectionRef.where('folderId', '==', folderId).get();
            const firebaseMap = new Map();
            snapshot.forEach(doc => firebaseMap.set(doc.id, doc.data()));

            driveImages.forEach(img => {
                if (!firebaseMap.has(img.id)) {
                    const newDoc = { folderId: folderId, name: img.name, elo: 0, wins: 0, matches: 0, url: img.url, status: 'active', history24h: [] };
                    batch.set(collectionRef.doc(img.id), newDoc);
                    imgData.push({ id: img.id, ...newDoc });
                } else {
                    const existing = firebaseMap.get(img.id);
                    existing.url = img.url; 
                    existing.name = img.name; 
                    existing.wins = existing.wins || 0;
                    existing.matches = existing.matches || 0;
                    existing.status = existing.status || 'active';
                    existing.history24h = existing.history24h || []; 
                    imgData.push({ id: img.id, ...existing });
                }
            });
            await batch.commit();
            folderData[folderId] = imgData; 
        }

        function applyDynamicRules(folderId) {
            let pool = folderData[folderId];
            
            pool.forEach(img => {
                if (img.status === 'active') {
                    let result = checkCheckpoints(img);
                    if (result === 'hc') {
                        img.status = 'hors_concours';
                        db.collection('images').doc(img.id).update({ status: 'hors_concours' });
                    } else if (result === 'reject') {
                        applyRejection(img, true); 
                    }
                }
            });
        }

        // ==========================================
        // MODO FOCO E ARENA
        // ==========================================
        function startFocusMode(folderId, imgId) {
            targetedImgInfo = { folderId, id: imgId };
            document.getElementById('focus-mode-banner').style.display = 'block';
            closeRank();
            setupNextMatch();
        }

        function cancelFocusMode() {
            targetedImgInfo = null;
            document.getElementById('focus-mode-banner').style.display = 'none';
            setupNextMatch();
        }

        function setupNextMatch() {
            isProcessingVote = false;
            document.getElementById('fighter1').className = 'combatant';
            document.getElementById('fighter2').className = 'combatant';
            document.getElementById('fraction1').style.display = 'none';
            document.getElementById('fraction2').style.display = 'none';

            let p1, p2;
            let foundMatch = false;
            let attempts = 0;
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;

            if (targetedImgInfo) {
                const folderId = targetedImgInfo.folderId;
                const activePool = folderData[folderId].filter(i => i.status === 'active');
                p1 = activePool.find(i => i.id === targetedImgInfo.id);
                
                if (p1) {
                    const recentFights = (p1.history24h || []).filter(h => now - h.t <= oneDay);
                    let validOpponents = activePool.filter(img => {
                        if (img.id === p1.id) return false;
                        return !recentFights.some(h => h.op === img.id);
                    });

                    if (validOpponents.length > 0) {
                        p2 = validOpponents[Math.floor(Math.random() * validOpponents.length)];
                        foundMatch = true;
                        currentMatchup = { folderId: folderId, img1: p1, img2: p2 };
                    } else {
                        alert("Esta imagem já disputou contra todos os oponentes válidos nas últimas 24h! O Modo Foco será encerrado.");
                        cancelFocusMode();
                        return; 
                    }
                } else {
                    cancelFocusMode();
                    return;
                }
            }

            if (!targetedImgInfo && !foundMatch) {
                let validFolders = activeFolders.filter(f => {
                    let pool = folderData[f.id].filter(i => i.status === 'active');
                    return pool.length >= 2;
                });

                if (validFolders.length === 0) {
                    alert("A arena está vazia! Todas as imagens viraram Hors Concours ou foram Rejeitadas.");
                    return;
                }

                const randomFolder = validFolders[Math.floor(Math.random() * validFolders.length)];
                const activePool = folderData[randomFolder.id].filter(i => i.status === 'active');
                
                while (!foundMatch && attempts < 100) {
                    p1 = activePool[Math.floor(Math.random() * activePool.length)];
                    const recentFights = (p1.history24h || []).filter(h => now - h.t <= oneDay);
                    
                    let validOpponents = activePool.filter(img => {
                        if (img.id === p1.id) return false; 
                        return !recentFights.some(h => h.op === img.id);
                    });

                    if (validOpponents.length > 0) {
                        p2 = validOpponents[Math.floor(Math.random() * validOpponents.length)];
                        foundMatch = true;
                    }
                    attempts++;
                }

                if (!foundMatch) {
                    p1 = activePool[Math.floor(Math.random() * activePool.length)];
                    do { p2 = activePool[Math.floor(Math.random() * activePool.length)]; } while (p1.id === p2.id);
                }

                currentMatchup = { folderId: randomFolder.id, img1: p1, img2: p2 };
            }

            const folderObj = activeFolders.find(f => f.id === currentMatchup.folderId);
            if (folderObj) {
                document.getElementById('header-folder-name').innerText = formatFolderName(folderObj.name);
            }

            updateArenaUI();
        }

        function updateArenaUI() {
            const { img1, img2 } = currentMatchup;
            
            // O "T" agora aponta qual é o Próximo Checkpoint / Julgamento daquela imagem
            const t1 = getNextCheckpoint(img1.matches);
            const t2 = getNextCheckpoint(img2.matches);
            
            document.getElementById('img1').src = img1.url;
            document.getElementById('loyalty1').innerText = `L: ${getLoyalty(img1)}%`;
            document.getElementById('fraction1').innerText = `W: ${img1.wins}; M: ${img1.matches}; T: ${t1}`;

            document.getElementById('img2').src = img2.url;
            document.getElementById('loyalty2').innerText = `L: ${getLoyalty(img2)}%`;
            document.getElementById('fraction2').innerText = `W: ${img2.wins}; M: ${img2.matches}; T: ${t2}`;
        }

        // ==========================================
        // EXCLUSÃO E VOTAÇÃO
        // ==========================================
        async function applyRejection(img, silent = false) {
            img.status = 'rejected';
            db.collection('images').doc(img.id).update({ status: 'rejected' });
            
            if (!silent) showToast("🗑️ Imagem movida para Lixeira!", "danger");

            try {
                await gapi.client.drive.files.update({
                    fileId: img.id, addParents: REJECT_FOLDER_ID, removeParents: img.folderId, fields: 'id'
                });
            } catch (e) { console.error("Erro ao mover no drive", e); }
        }

        async function blockImage(e, imgNumber) {
            e.stopPropagation(); 
            if (isProcessingVote) return;
            isProcessingVote = true;

            const targetImg = imgNumber === 1 ? currentMatchup.img1 : currentMatchup.img2;
            document.getElementById(`fighter${imgNumber}`).classList.add('blocked');
            document.getElementById('undo_button').style.display = 'none';

            await applyRejection(targetImg);
            setTimeout(setupNextMatch, 400); 
        }

        async function vote(winnerNumber) {
            if (isProcessingVote) return;
            isProcessingVote = true;

            const { folderId, img1, img2 } = currentMatchup;
            const winner = winnerNumber === 1 ? img1 : img2;
            const loser = winnerNumber === 1 ? img2 : img1;

            lastVoteState = {
                folderId: folderId,
                img1Ref: img1, img2Ref: img2,
                winnerOld: { ...winner, history24h: [...(winner.history24h || [])] },
                loserOld: { ...loser, history24h: [...(loser.history24h || [])] },
                loserWasRejected: false,
                winnerWasHC: false
            };

            document.getElementById(`fighter${winnerNumber}`).classList.add('winner');
            document.getElementById(`fighter${winnerNumber === 1 ? 2 : 1}`).classList.add('loser');
            
            document.getElementById('fraction1').style.display = 'block';
            document.getElementById('fraction2').style.display = 'block';

            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            const K = 32;

            // ==================
            // ATUALIZA WINNER
            // ==================
            winner.wins += 1;
            winner.matches += 1;
            winner.history24h = (winner.history24h || []).filter(h => now - h.t <= oneDay);
            winner.history24h.push({ t: now, w: true, op: loser.id });
            winner.elo = winner.elo + K * (1 - (1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400))));

            // Verifica Checkpoint do Vencedor
            let wResult = checkCheckpoints(winner);
            if (wResult === 'hc') {
                winner.status = 'hors_concours';
                lastVoteState.winnerWasHC = true;
                showToast("🌟 Imagem coroada Hors Concours!", "gold");
            } else if (wResult === 'reject') {
                applyRejection(winner, true);
            }
            db.collection('images').doc(winner.id).update({ elo: winner.elo, wins: winner.wins, matches: winner.matches, history24h: winner.history24h, status: winner.status, name: winner.name });

            // ==================
            // ATUALIZA LOSER
            // ==================
            loser.matches += 1;
            loser.history24h = (loser.history24h || []).filter(h => now - h.t <= oneDay);
            loser.history24h.push({ t: now, w: false, op: winner.id });
            loser.elo = loser.elo + K * (0 - (1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400))));

            // Verifica Checkpoint do Perdedor
            let lResult = checkCheckpoints(loser);
            if (lResult === 'reject') {
                lastVoteState.loserWasRejected = true;
                applyRejection(loser, false); 
            } else if (lResult === 'hc') {
                loser.status = 'hors_concours';
                db.collection('images').doc(loser.id).update({ status: 'hors_concours' });
            } else {
                db.collection('images').doc(loser.id).update({ elo: loser.elo, matches: loser.matches, history24h: loser.history24h, name: loser.name });
            }

            document.getElementById('undo_button').style.display = 'block';
            setTimeout(setupNextMatch, 1000); 
        }

        async function undoLastVote() {
            if (!lastVoteState) return;
            const state = lastVoteState;
            
            Object.assign(state.img1Ref, state.img1Ref.id === state.winnerOld.id ? state.winnerOld : state.loserOld);
            Object.assign(state.img2Ref, state.img2Ref.id === state.winnerOld.id ? state.winnerOld : state.loserOld);

            const img1 = state.img1Ref;
            const img2 = state.img2Ref;

            db.collection('images').doc(img1.id).update({ elo: img1.elo, wins: img1.wins, matches: img1.matches, status: img1.status, history24h: img1.history24h });
            db.collection('images').doc(img2.id).update({ elo: img2.elo, wins: img2.wins, matches: img2.matches, status: img2.status, history24h: img2.history24h });

            if (state.loserWasRejected) {
                const loser = img1.id === state.loserOld.id ? img1 : img2;
                gapi.client.drive.files.update({ fileId: loser.id, addParents: loser.folderId, removeParents: REJECT_FOLDER_ID, fields: 'id' });
            }

            currentMatchup = { folderId: state.folderId, img1: img1, img2: img2 };
            lastVoteState = null;
            document.getElementById('undo_button').style.display = 'none';
            
            document.getElementById('fighter1').className = 'combatant';
            document.getElementById('fighter2').className = 'combatant';
            document.getElementById('fraction1').style.display = 'none';
            document.getElementById('fraction2').style.display = 'none';
            
            updateArenaUI();
            isProcessingVote = false;
        }

        // ==========================================
        // MENUS E RANKS
        // ==========================================
        function getFolderProgress(folderId) {
            let basePool = folderData[folderId].filter(i => !isRejected(i));
            let N = basePool.length;
            if (N === 0) return 0;
            
            let activePool = basePool.filter(i => i.status === 'active');
            return Math.round(((N - activePool.length) / N) * 100);
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

        function renderMenu() {
            const container = document.getElementById('folder-list-container');
            container.innerHTML = '';
            activeFolders.forEach(f => {
                const activeCount = folderData[f.id].filter(i => i.status === 'active').length;
                if (activeCount > 0) {
                    const div = document.createElement('div');
                    div.className = 'folder-item';
                    div.innerHTML = `<span>${f.name}</span> <span class="count">${activeCount} ativas | ${getFolderProgress(f.id)}%</span>`;
                    div.onclick = () => openFolderRank(f.id, f.name);
                    container.appendChild(div);
                }
            });
        }

        function renderGrid(imagesArray, title, subtitle = "", isFolderRank = false, folderId = null) {
            toggleMenu();
            document.getElementById('rank-title-area').innerHTML = `<h3>${title}</h3><div class="rank-subtitle">${subtitle}</div>`;
            const container = document.getElementById('rank-grid-container');
            container.innerHTML = '';

            imagesArray.forEach((img, i) => {
                let text = `L:${getLoyalty(img)}%`;
                if(isRejected(img)) text = "EXCLUÍDA";
                if(isHorsConcours(img)) text = "HORS CONC.";
                
                const div = document.createElement('div');
                div.className = 'rank-item';
                
                let imgClass = '';
                if (img.exhausted24h) imgClass = 'exhausted';
                
                div.innerHTML = `<img src="${img.url}" loading="lazy" class="${imgClass}"><div class="rank-badge">#${i+1} | ${text}</div>`;
                
                if (isFolderRank && img.status === 'active') {
                    div.style.cursor = 'pointer';
                    div.onclick = () => startFocusMode(folderId, img.id);
                }
                
                container.appendChild(div);
            });
            document.getElementById('ranking-screen').style.display = 'flex';
        }

        function openLoyaltyRank() {
            let pool = [];
            for (let k in folderData) pool = pool.concat(folderData[k]);
            let invictas = pool.filter(i => i.status === 'active' && i.matches > 0 && getLoyalty(i) === 100);
            invictas.sort(sortEloName); 
            renderGrid(invictas, "100% Lealdade (Ativas)", "Ordenado por ELO > Nome");
        }

        function openHorsConcoursRank() {
            let pool = [];
            for (let k in folderData) pool = pool.concat(folderData[k]);
            let hors = pool.filter(i => isHorsConcours(i));
            hors.sort(sortEloName); 
            renderGrid(hors, "Galeria Hors Concours", "Elite da Curadoria (>90% Lealdade)");
        }

        function openRejectedReport() {
            let pool = [];
            for (let k in folderData) pool = pool.concat(folderData[k]);
            let rejeitadas = pool.filter(i => isRejected(i));
            rejeitadas.sort(sortEloName); 
            renderGrid(rejeitadas, "Relatório de Excluídas", "Eliminadas por baixa lealdade ou bloqueio");
        }

        function openFolderRank(folderId, folderName) {
            const activePool = folderData[folderId].filter(i => i.status === 'active');
            let pool = [...activePool];
            
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            
            pool.forEach(img => {
                const recentOps = (img.history24h || []).filter(h => now - h.t <= oneDay).map(h => h.op);
                img.exhausted24h = activePool.every(other => other.id === img.id || recentOps.includes(other.id));
            });

            pool.sort(sortEloName);
            renderGrid(pool, `Bolha: ${formatFolderName(folderName)}`, `Progresso da Triagem: ${getFolderProgress(folderId)}% (CLIQUE NA FOTO)`, true, folderId);
        }

        function closeRank() { document.getElementById('ranking-screen').style.display = 'none'; }
    </script>
